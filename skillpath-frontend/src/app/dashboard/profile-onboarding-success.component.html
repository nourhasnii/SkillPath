<div class="dashboard-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/" aria-label="SkillPath home">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span>skillpath<span class="brand-period">.</span></span>
    </a>
    <nav class="side-navigation" aria-label="Personal navigation">
      <div class="nav-group">
        <p>WORKSPACE</p>
        <a [routerLink]="user()?.role === 'STUDENT' ? '/student/dashboard' : '/professional/dashboard'">
          <span class="nav-icon">⌂</span> Home
        </a>
        <a [routerLink]="user()?.role === 'STUDENT' ? '/student/onboarding' : '/professional/onboarding'">
          <span class="nav-icon">◎</span> Profile setup
        </a>
      </div>
      <div class="nav-group">
        <p>CAREER TOOLS</p>
        <a routerLink="/skill-gap"><span class="nav-icon">⌁</span> Skill Gap</a>
        <a routerLink="/learning-path"><span class="nav-icon">→</span> Learning Path</a>
        <a routerLink="/knowledge-graph"><span class="nav-icon">◈</span> Knowledge Graph</a>
      </div>
    </nav>
  </aside>

  <main class="dashboard-main">
    <header class="topbar">
      <div class="breadcrumb"><span>SkillPath</span><i>/</i><strong>Profile ready</strong></div>
      <span class="workspace-badge"><span></span> {{ user()?.role }}</span>
    </header>

    <div class="dashboard-content">
      <section class="form-card success-card">
        <div class="success-icon">✓</div>
        <p class="eyebrow">PROFILE CONFIRMED</p>
        <h1>{{ message() }}</h1>
        <button type="button" class="button-primary success-button" (click)="continue()">
          {{ primaryLabel() }}
        </button>
      </section>
    </div>
  </main>
</div>
